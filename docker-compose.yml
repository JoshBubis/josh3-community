# Local stand-in for the production container. DNS and the live cutover are separate.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: josh3
      POSTGRES_PASSWORD: josh3
      POSTGRES_DB: josh3_community_production
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    ports:
      - "3000:80"
    environment:
      DATABASE_URL: postgres://josh3:josh3@db:5432/josh3_community_production
      SECRET_KEY_BASE: change-me-before-any-real-deploy
      RAILS_HOSTS: localhost,127.0.0.1
      RAILS_LOG_LEVEL: info
    depends_on:
      - db

volumes:
  pgdata:
