default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  <% if ENV["POSTGRES_USER"].present? %>
  username: <%= ENV["POSTGRES_USER"] %>
  <% end %>
  <% if ENV["POSTGRES_PASSWORD"].present? %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  <% end %>
  <% if ENV["POSTGRES_HOST"].present? %>
  host: <%= ENV["POSTGRES_HOST"] %>
  <% end %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>

development:
  <<: *default
  database: josh3_community_development

test:
  <<: *default
  database: josh3_community_test

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "josh3_community_production") %>
  <% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"] %>
  <% end %>
